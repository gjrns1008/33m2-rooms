name: Refresh 33m2 listings
on:
  schedule:
    - cron: '0 3 * * *'  # 12:00 KST (UTC 03:00)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Crawl and rebuild index.html
        run: python crawl.py index.html
      - name: Commit if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html rooms.json
          # 조회 시각 문구만 바뀐 경우도 커밋(공개 페이지의 '마지막 갱신' 표시를 최신으로 유지)
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Refresh listings $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"; git push; fi
      - name: Telegram notice (completion only)
        if: ${{ success() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py "삼삼엠투 매물 페이지 업데이트 완료"
